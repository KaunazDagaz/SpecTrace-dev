name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test-reproduce:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    env:
      SPECTRACE_OFFLINE: 1
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up the .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --warnaserror --no-restore

      - name: Test
        run: dotnet test --no-build --verbosity normal

      - name: Reproduce the reference run with the README command
        run: dotnet run --project src/SpecTrace.Cli -- run --document corpus/rfc6902.txt --offline --out runs/reference

      - name: Upload the regenerated run
        uses: actions/upload-artifact@v4
        with:
          name: reference-run-${{ matrix.os }}
          path: runs/reference/
          if-no-files-found: error
